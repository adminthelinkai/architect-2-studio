name: Quality
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:security
      - run: npm audit --audit-level=moderate
      - run: npm run build
      - run: npm run db:local
      - name: Start local preview
        run: |
          npm run dev > /tmp/architect-preview.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:5173/auth >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/architect-preview.log
          exit 1
      - run: npm run test:e2e
      - run: npm run test:audit
      - run: npm run test:resilience
      - run: npm run test:a11y
